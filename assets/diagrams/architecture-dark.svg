  <text x="503" y="746" class="bdgt" text-anchor="middle">5</text>
  <circle cx="205" cy="802" r="9" class="bdg"/>
  <text x="205" y="806" class="bdgt" text-anchor="middle">7</text>
  <rect x="60" y="882" width="612" height="160" rx="8" class="pz"/>
  <text x="76" y="900" class="pl">PRIVATE TO ONE PERSON</text>
  <text x="248.0851" y="900" class="f">personal_memory.go · oauth_user.go</text>
  <text x="76" y="926" class="h">your notes</text>
  <text x="372" y="926" class="h">your accounts</text>
  <text x="76" y="947" class="b"><tspan class="ok">✓</tspan> own table, keyed to you</text>
  <text x="76" y="966" class="b"><tspan class="ok">✓</tspan> read only on your own turns</text>
  <text x="76" y="985" class="b"><tspan class="ok">✓</tspan> no admin, export or /v1 route</text>
  <text x="76" y="1004" class="b"><tspan class="ok">✓</tspan> edits never logged to the org</text>
  <text x="372" y="947" class="b"><tspan class="ok">✓</tspan> Gmail · Calendar · Drive as you</text>
  <text x="372" y="966" class="b"><tspan class="ok">✓</tspan> token sealed, spent on your calls</text>
  <text x="372" y="985" class="b"><tspan class="ok">✓</tspan> admins see metadata, not content</text>
  <text x="372" y="1004" class="b"><tspan class="ok">✓</tspan> connect link: yours, 30 minutes</text>
  <text x="76" y="1030" class="b"><tspan class="ok">✓</tspan> API keys, MCP tokens and forwarded mail can reach neither</text>
  <rect x="60" y="1058" width="612" height="52" rx="6" class="strip"/>
  <text x="76" y="1079" class="sh">audit log</text>
  <text x="158.4457" y="1079" class="sm">audit.go · retention.go</text>
  <text x="76" y="1098" class="sb">every turn, tool call, proxied request and console, /v1 or MCP write</text>
