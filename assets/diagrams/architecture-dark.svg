  <rect x="32" y="196" width="648" height="948" rx="8" class="proc"/><text x="60" y="1132" class="pl2">ATTESTTAG · ONE GO PROCESS</text><text x="270.2006" y="1132" class="f">cmd/attesttag · a single binary</text>
  <text x="20" y="34" class="h">attest_tag · architecture</text>
  <text x="20" y="56" class="f">trust boundaries, and the check each hop has to pass</text>
  <path d="M712 22H738" class="l" marker-end="url(#e)"/>
  <text x="746" y="26" class="f">request · data</text>
  <path d="M850 22H876" class="lk" marker-end="url(#k)"/>
  <text x="884" y="26" class="f">carries a key</text>
  <rect x="712" y="34" width="26" height="13" rx="3" class="zb"/>
  <text x="746" y="45" class="f">trust boundary</text>
  <text x="856" y="45" class="f"><tspan class="ok">✓</tspan></text>
  <text x="884" y="45" class="f">check in code</text>
  <circle cx="725" cy="60" r="9" class="bdg"/>
  <text x="725" y="64" class="bdgt" text-anchor="middle">1</text>
  <text x="746" y="64" class="f">one tool call</text>
  <rect x="850" y="53" width="26" height="13" rx="3" class="pz"/>
  <text x="884" y="64" class="f">per person</text>
  <rect x="20" y="80" width="668" height="86" rx="8" class="zb"/>
  <text x="34" y="97" class="zl">INTERNET · UNTRUSTED</text>
  <rect x="36" y="104" width="150" height="50" rx="5" class="bx"/>
  <text x="50" y="125" class="h">Slack</text>
  <text x="50" y="143" class="f">mentions · DMs</text>
  <rect x="198" y="104" width="150" height="50" rx="5" class="bx"/>
  <text x="212" y="125" class="h">Microsoft Teams</text>
  <text x="212" y="143" class="f">channels · chats</text>
  <rect x="360" y="104" width="150" height="50" rx="5" class="bx"/>
  <text x="374" y="125" class="h">Browser</text>
  <text x="374" y="143" class="f">admin console</text>
  <rect x="522" y="104" width="150" height="50" rx="5" class="bx"/>
  <text x="536" y="125" class="h">API / MCP client</text>
  <text x="536" y="143" class="f">scripts · agents</text>
  <rect x="60" y="228" width="612" height="150" rx="6" class="lay"/>
  <text x="76" y="250" class="h">ingress</text>
  <text x="142.7911" y="250" class="f">HTTP :8080 · bot.go · headers.go</text>
  <text x="76" y="274" class="ink">/slack/events</text>
  <text x="229" y="274" class="b"><tspan class="ok">✓</tspan> HMAC-SHA256 over the raw body, 5-minute window</text>
  <text x="76" y="293" class="ink">/slack/interactions</text>
  <text x="229" y="293" class="b"><tspan class="ok">✓</tspan> same signature · Confirm by asker or approver</text>
  <text x="76" y="312" class="ink">/msteams/messages</text>
  <text x="229" y="312" class="b"><tspan class="ok">✓</tspan> Bot Framework JWT: Microsoft keys, issuer, audience</text>
  <text x="76" y="331" class="ink">/admin/  /api/</text>
  <text x="229" y="331" class="b"><tspan class="ok">✓</tspan> session · 2FA · SSO · CSRF · roles · throttling</text>
  <text x="76" y="350" class="ink">/v1/  /mcp</text>
  <text x="229" y="350" class="b"><tspan class="ok">✓</tspan> hashed keys with the maker's access · OAuth + PKCE</text>
  <text x="76" y="369" class="ink">every route</text>
  <text x="229" y="369" class="b"><tspan class="ok">✓</tspan> org isolation · CSP · HSTS · no framing</text>
  <rect x="60" y="406" width="612" height="116" rx="6" class="lay"/>
  <text x="76" y="428" class="h">turn loop</text>
  <text x="158.4457" y="428" class="f">agent.go · routing.go · repeat_guard.go</text>
  <text x="76" y="452" class="b"><tspan class="ok">✓</tspan> Slack delivery sealed (AES-GCM) in an inbox, deduplicated by id</text>
  <text x="76" y="471" class="b"><tspan class="ok">✓</tspan> context rebuilt from the thread on every turn</text>
  <text x="76" y="490" class="b"><tspan class="ok">✓</tspan> tool output wrapped as data; fake tool-result tags stripped</text>
  <text x="76" y="509" class="b"><tspan class="ok">✓</tspan> caps on rounds, spend and time; a 4th identical call is refused</text>
  <rect x="60" y="550" width="612" height="116" rx="6" class="lay"/>
  <text x="76" y="572" class="h">tools</text>
  <text x="127.1365" y="572" class="f">tools_*.go · rag.go · sandbox.go · mcp.go</text>
  <text x="76" y="596" class="ink">slack search · docs (RAG) · web · memory · routines · artifacts</text>
  <text x="76" y="615" class="b"><tspan class="ok">✓</tspan> run_js: QuickJS as wasm (wazero), no syscalls, no files</text>
  <text x="76" y="634" class="b"><tspan class="ok">✓</tspan> web fetch: ports 80/443, public hosts only</text>
  <text x="76" y="653" class="ink">http_request · run_js fetch() · MCP → the proxy ↓</text>
  <text x="660" y="653" class="ink" text-anchor="end">start_fix_job →</text>
  <rect x="60" y="700" width="612" height="156" rx="6" class="kly"/>
  <text x="76" y="722" class="h">credential proxy</text>
  <text x="213.2368" y="722" class="f">proxy.go · outbound.go · crypto.go</text>
  <rect x="76" y="738" width="133" height="46" rx="4" class="st"/>
  <text x="86" y="757" class="ink">host must be</text>
  <text x="86" y="774" class="b">allow-listed</text>
  <rect x="225" y="738" width="133" height="46" rx="4" class="st"/>
  <text x="235" y="757" class="ink">key sent only</text>
  <text x="235" y="774" class="b">over https</text>
  <rect x="374" y="738" width="133" height="46" rx="4" class="st"/>
  <text x="384" y="757" class="ink">a write waits</text>
  <text x="384" y="774" class="b">for Confirm</text>
  <rect x="523" y="738" width="133" height="46" rx="4" class="st"/>
  <text x="533" y="757" class="ink">model's auth</text>
  <text x="533" y="774" class="b">headers dropped</text>
  <rect x="523" y="798" width="133" height="46" rx="4" class="st"/>
  <text x="533" y="817" class="ink">key unsealed,</text>
  <text x="533" y="834" class="b">added at egress</text>
  <rect x="374" y="798" width="133" height="46" rx="4" class="st"/>
  <text x="384" y="817" class="ink">dialled only to</text>
  <text x="384" y="834" class="b">public addresses</text>
  <rect x="225" y="798" width="133" height="46" rx="4" class="st"/>
  <text x="235" y="817" class="ink">one audit row</text>
  <text x="235" y="834" class="b">per request</text>
  <rect x="76" y="798" width="133" height="46" rx="4" class="st"/>
  <text x="86" y="817" class="ink">reply scrubbed</text>
  <text x="86" y="834" class="b">of secrets</text>
