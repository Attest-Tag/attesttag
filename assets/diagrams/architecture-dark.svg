  <rect x="712" y="902" width="268" height="218" rx="8" class="zb"/>
  <text x="726" y="919" class="zl">STORAGE · YOURS</text>
  <rect x="724" y="928" width="244" height="66" rx="5" class="kbx"/>
  <text x="738" y="948" class="h">sealed at rest</text>
  <text x="738" y="967" class="b">AES-256-GCM under MASTER_KEY</text>
  <text x="738" y="985" class="b">service keys · tokens · inbox</text>
