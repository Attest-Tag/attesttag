  <path d="M368 523V548" class="l" marker-end="url(#e)"/>
  <path d="M368 667V698" class="l" marker-end="url(#e)"/>
  <circle cx="388" cy="683.0" r="9" class="bdg"/>
  <text x="388" y="687.0" class="bdgt" text-anchor="middle">4</text>
  <path d="M58 717H44V155" class="lc" marker-start="url(#e)" marker-end="url(#e)" stroke-dasharray="4 3"/>
  <circle cx="44" cy="608.0" r="9" class="bdg"/>
  <text x="44" y="612.0" class="bdgt" text-anchor="middle">5</text>
  <rect x="712" y="88" width="268" height="244" rx="6" class="bx"/>
  <text x="726" y="110" class="h">one tool call, end to end</text>
  <circle cx="735" cy="134" r="9" class="bdg"/>
  <text x="735" y="138" class="bdgt" text-anchor="middle">1</text>
  <text x="752" y="138" class="b">signed Slack event is verified</text>
  <circle cx="735" cy="163" r="9" class="bdg"/>
  <text x="735" y="167" class="bdgt" text-anchor="middle">2</text>
  <text x="752" y="167" class="b">inbox seals it; a turn starts</text>
  <circle cx="735" cy="192" r="9" class="bdg"/>
  <text x="735" y="196" class="bdgt" text-anchor="middle">3</text>
  <text x="752" y="196" class="b">model sees the thread, no keys</text>
  <circle cx="735" cy="221" r="9" class="bdg"/>
  <text x="735" y="225" class="bdgt" text-anchor="middle">4</text>
  <text x="752" y="225" class="b">it calls a tool via the proxy</text>
  <circle cx="735" cy="250" r="9" class="bdg"/>
  <text x="735" y="254" class="bdgt" text-anchor="middle">5</text>
  <text x="752" y="254" class="b">a write waits for Confirm</text>
  <circle cx="735" cy="279" r="9" class="bdg"/>
  <text x="735" y="283" class="bdgt" text-anchor="middle">6</text>
  <text x="752" y="283" class="b">key added at egress, TLS only</text>
  <circle cx="735" cy="308" r="9" class="bdg"/>
  <text x="735" y="312" class="bdgt" text-anchor="middle">7</text>
  <text x="752" y="312" class="b">reply scrubbed and audited</text>
  <rect x="712" y="394" width="268" height="140" rx="8" class="zb"/>
  <text x="726" y="411" class="zl">THIRD PARTY</text>
  <rect x="724" y="420" width="244" height="104" rx="5" class="bx"/>
  <text x="738" y="442" class="h">model endpoint</text>
  <text x="859.5822" y="442" class="f">llm.go</text>
  <text x="738" y="462" class="b">any OpenAI-compatible API</text>
  <text x="738" y="480" class="b">or the org's own key</text>
  <text x="738" y="498" class="b"><tspan class="ok">✓</tspan> secrets redacted first</text>
  <text x="738" y="516" class="b"><tspan class="ok">✓</tspan> never sees a service key</text>
  <path d="M673 464.0H722" class="l" marker-start="url(#e)" marker-end="url(#e)"/>
  <circle cx="696.0" cy="450.0" r="9" class="bdg"/>
  <text x="696.0" y="454.0" class="bdgt" text-anchor="middle">3</text>
  <rect x="712" y="550" width="268" height="180" rx="8" class="zb"/>
  <text x="726" y="567" class="zl">ISOLATED · OWN CONTAINER</text>
  <rect x="724" y="576" width="244" height="146" rx="5" class="bx"/>
  <text x="738" y="598" class="h">fix-job worker</text>
  <text x="859.5822" y="598" class="f">internal/worker</text>
  <text x="738" y="618" class="b">clone → build → test → fix</text>
  <text x="738" y="636" class="b">→ re-test → draft PR</text>
  <text x="738" y="654" class="b"><tspan class="ok">✓</tspan> repo code runs as uid 10002</text>
  <text x="738" y="672" class="b"><tspan class="ok">✓</tspan> agent holds no git token</text>
  <text x="738" y="690" class="b"><tspan class="ok">✓</tspan> one-job token, then revoked</text>
  <text x="738" y="708" class="b"><tspan class="ok">✓</tspan> draft PR only, never merges</text>
  <path d="M673 649H722" class="l" marker-start="url(#e)" marker-end="url(#e)"/>
  <path d="M946 575V525" class="l" marker-end="url(#e)"/>
  <text x="938" y="546" class="f" text-anchor="end">its own model key</text>
  <rect x="712" y="746" width="268" height="144" rx="8" class="zb"/>
  <text x="726" y="763" class="zl">THIRD PARTY</text>
  <rect x="724" y="772" width="244" height="108" rx="5" class="bx"/>
  <text x="738" y="794" class="h">connected services</text>
  <text x="738" y="814" class="b">GitHub (App token per call)</text>
  <text x="738" y="832" class="b">Google · ClickUp · HubSpot</text>
  <text x="738" y="850" class="b">34 presets · remote MCP</text>
  <text x="738" y="868" class="b"><tspan class="ok">✓</tspan> allow-listed hosts only</text>
  <path d="M946 723V771" class="l" marker-end="url(#e)"/>
