<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1184" width="1000" height="1184" role="img" aria-labelledby="t d">
  <title id='t'>attest_tag architecture</title><desc id='d'>How a request moves through attest_tag: signed ingress, the turn loop, tools, the credential proxy that injects keys the model never sees, the per-person private zone, the audit log, the isolated fix-job worker, third-party services and storage.</desc>
