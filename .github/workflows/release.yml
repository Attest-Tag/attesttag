# Publish a release from a v* tag: the bot image, the fix-job worker images, the Helm chart, the
# binaries, and the GitHub release that names them and carries the binaries — the images every
# deploy path pulls by default (ghcr.io/attest-tag/attesttag), the chart the Kubernetes guide
# installs, and the binary for running without a container.
#
# Multi-arch here costs almost nothing, and the reason is worth knowing before anyone
# "optimises" it: the binary is CGO_ENABLED=0 with pure-Go SQLite (modernc.org/sqlite), so Go
# cross-compiles. The Dockerfile pins its node and golang stages to $BUILDPLATFORM and passes
# $TARGETARCH to `go build`, which means linux/arm64 is built by an amd64 runner at native
# speed. No QEMU, no arm64 runner, no per-architecture jobs to merge afterwards.
#
# Everything goes to GHCR and is signed there. There used to be an optional Docker Hub mirror, for
# a Cloudflare Containers target that could not pull from GHCR; deploy/ has no such target, and
# the mirror was unsigned and documented nowhere, so it went.
name: release

# A release is cut by pushing a v* tag, and only that. workflow_dispatch was removed on purpose:
# it built whatever branch it was run from (its `tag` input was never used) and could move :latest
# and the :major/:minor tags to a branch head. Who may create a v* tag is controlled by a tag
# ruleset on the repository.
on:
  push:
    tags: ["v*"]

# Read-only by default; the jobs that publish ask for what they need, and only they. The test job
# runs npm ci and go test with no more than read, so a compromised dependency cannot reach the
# registry or the signing identity.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # The suite gates the release. A tag that cannot pass its own tests should not become an
  # image that every deploy script pulls by default.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The GitHub release opens with this version's section of CHANGELOG.md: what changed and
      # what an upgrade asks of you. A tag with no section stops here, before anything is
      # published. A prerelease (0.2.0-rc.1) is checked for the section of the release it leads to.
      - name: CHANGELOG.md has a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## ${version%%-*}" 'index($0, want " ") == 1 || $0 == want { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${version%%-*}' section for ${GITHUB_REF_NAME}" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # The console is embedded with //go:embed, so it has to exist before anything compiles.
      - run: cd ui && npm ci --no-audit --no-fund && npm run build
      - run: go vet ./...
      # As ci.yml runs it: TestEvals skips itself without -eval, and the whole suite on one runner
      # can outlast go test's default ten minutes.
      - run: go test -skip TestEvals -timeout 30m ./...

  bot:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # A deploy template pins the moving minor (:1.4), so a restart brings security fixes
          # and never a surprise migration. :latest only on a real release, never a prerelease.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # What somebody checks before trusting a container from a repository they just found.
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          # GHCR image paths are lowercase; github.repository keeps the owner's case (Attest-Tag),
          # which cosign would reject. Lowercase it here — the same reason metadata-action does.
          cosign sign --yes "${REGISTRY}/${GITHUB_REPOSITORY,,}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          DIGEST: ${{ steps.build.outputs.digest }}

  # The fix-job workers are amd64 only, deliberately. The image is 2.5-5 GB and its arm64 build
  # pulls a different Rust toolchain, a different mise binary and a different .NET SDK — a second
  # long build and a second class of "the download 404'd" failure, for a feature that defaults to
  # off. Every dispatcher copes: the Cloud Run, ECS and Container Apps scripts build or run amd64,
  # the Kubernetes one pins its pods to amd64 nodes (WORKER_K8S_ARCH), and an arm64 Docker host
  # builds its own from Dockerfile.worker.
  worker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing — the worker runs untrusted repository code, so its
        # image is signed and given an SBOM like the bot's, which it previously was not.
    outputs:
      digest: ${{ steps.base.outputs.digest }}
      jvm-digest: ${{ steps.buildjvm.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths are lowercase; github.repository keeps the owner's case (Attest-Tag). The
      # metadata-action below lowercases on its own, but the BASE build-arg and the cosign calls
      # take a plain string, so compute the lowercase image names once here.
      - id: names
        run: |
          echo "worker=${REGISTRY}/${GITHUB_REPOSITORY,,}-worker" >> "$GITHUB_OUTPUT"
          echo "jvm=${REGISTRY}/${GITHUB_REPOSITORY,,}-worker-jvm" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.worker }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # The labels are what GHCR links a package to this repository by
      # (org.opencontainers.image.source), and the version and revision it was built from. Without
      # them the worker packages were orphans, unlike the bot's.
      - id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          provenance: mode=max
          sbom: true

      # Java and .NET repositories run on a heavier image built from the one above.
      - id: metajvm
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.jvm }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: buildjvm
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker.jvm
          platforms: linux/amd64
          push: true
          build-args: |
            BASE=${{ steps.names.outputs.worker }}@${{ steps.base.outputs.digest }}
          tags: ${{ steps.metajvm.outputs.tags }}
          labels: ${{ steps.metajvm.outputs.labels }}
          cache-from: type=gha,scope=worker-jvm
          cache-to: type=gha,mode=max,scope=worker-jvm
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign the worker images
        run: |
          cosign sign --yes "${{ steps.names.outputs.worker }}@${{ steps.base.outputs.digest }}"
          cosign sign --yes "${{ steps.names.outputs.jvm }}@${{ steps.buildjvm.outputs.digest }}"

  # The chart deploy/helm/README.md installs, published beside the images it runs. It is packaged
  # with the tag as both its version and its appVersion, so a chart pulled from here runs the
  # images this release pushed rather than whatever :latest is when a pod restarts — the copy in
  # the repository says `latest`, having no release to name. After both image jobs, because a chart
  # must never name an image that was not published.
  chart:
    needs: [bot, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing, as for the images
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@v3
      # For cosign, not helm. cosign reads registry credentials from Docker's config, and
      # `helm registry login` below writes only Helm's own, so without this cosign reaches the chart
      # it is signing anonymously — which a package still private refuses. v0.1.0-rc.1 stopped
      # there: the chart pushed, unsigned, and no GitHub release after it.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # helm is on the runner image. GHCR paths are lowercase and github.repository_owner keeps
      # the owner's case (Attest-Tag), hence the ,, as for the images.
      - name: Package, push and sign the chart
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm package deploy/helm/attest-tag --version "$version" --app-version "$version"
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          pushed="$(helm push "attest-tag-${version}.tgz" "oci://${repo}" 2>&1)"
          printf '%s\n' "$pushed"
          digest="$(printf '%s\n' "$pushed" | sed -n 's/^Digest: //p')"
          [ -n "$digest" ] || { echo "helm push printed no digest to sign" >&2; exit 1; }
          cosign sign --yes "${repo}/attest-tag@${digest}"

  # The binaries the GitHub release carries, for running without a container: Linux and macOS,
  # amd64 and arm64, each a cross-compile for the reason at the top of this file, with the console
  # embedded. `make dist` is the whole recipe, so what a release holds can be built and looked at
  # locally first. SHA256SUMS lists the archives and is signed keylessly, as the images are, so
  # one verify-blob vouches for every archive.
  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing of SHA256SUMS
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - run: make ui
      - run: make dist VERSION="${GITHUB_REF_NAME#v}" COMMIT="$GITHUB_SHA"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with: { name: binaries, path: dist/, if-no-files-found: error, retention-days: 7 }

  # The GitHub release, last, so that it never names an image, a chart or a binary that failed to
  # publish. Its notes open with this version's section of CHANGELOG.md, then say what was
  # published and how to check it, then list the pull requests GitHub finds since the previous
  # release. A security fix's reporter is credited in its advisory (SECURITY.md).
  release:
    needs: [bot, worker, chart, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the binaries; this job builds nothing
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false } # for CHANGELOG.md
      - uses: actions/download-artifact@v8
        with: { name: binaries, path: dist }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          DIGEST: ${{ needs.bot.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          chart="oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts/attest-tag"
          # The section under "## <version>", up to the next release's heading. The test job has
          # already refused a tag without one.
          awk -v want="## ${version%%-*}" 'index($0, want " ") == 1 || $0 == want { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          **Images**, signed by this workflow with cosign:

          - \`${image}:${version}\` for linux/amd64 and linux/arm64, \`${DIGEST}\`
          - \`${image}-worker:${version}\` and \`${image}-worker-jvm:${version}\`, linux/amd64 only

          \`\`\`bash
          cosign verify ${image}@${DIGEST} \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          **Helm chart**: \`helm install attest-tag ${chart} --version ${version}\`

          **Binaries** for Linux and macOS, amd64 and arm64, are attached below with the console
          built in. Outside the image, PDFs need poppler's \`pdftotext\` on the PATH and SQLite
          replicated to a bucket needs \`litestream\`; the image carries both. \`SHA256SUMS\` lists
          the archives and is signed like the images:

          \`\`\`bash
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.cosign.bundle \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          shasum -a 256 --ignore-missing -c SHA256SUMS
          \`\`\`
          NOTES
          # GitHub shows a release's notes the way it shows a comment, every newline a line break,
          # so the hard-wrapped lines of CHANGELOG.md and of the text above are joined back into
          # paragraphs and list items. Code blocks are left as they are.
          awk '
            function flush() { if (buf != "") print buf; buf = "" }
            /^```/ { flush(); fence = !fence; print; next }
            fence { print; next }
            /^$/ { flush(); print; next }
            /^(#|- |\* |[0-9]+\. |\|)/ { flush(); buf = $0; next }
            { sub(/^ +/, ""); buf = (buf == "" ? $0 : buf " " $0) }
            END { flush() }
          ' notes.md > release-notes.md
          # A tag with a hyphen (v1.2.0-rc1) is a prerelease, as it is for the :latest tag above. A
          # release lists the pull requests since the previous release rather than since its own
          # prerelease, which would list next to nothing.
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
            *)
              prev="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                --limit 1 --json tagName --jq '.[0].tagName // empty')"
              [ -z "$prev" ] || flags+=(--notes-start-tag "$prev")
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes "${flags[@]}" dist/*
