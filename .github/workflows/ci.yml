# The checks a pull request has to pass. Deliberately separate from evals.yml, which runs the
# Go suite and govulncheck and is left alone. This is testing, not building: the image job below
# runs only on a merge into main.
name: ci

# Every pull request into the two long-lived branches and every push to them, so a merge is
# checked again as it lands. Both branches require these jobs to pass before a merge. Deployment is not here yet; when it is, it belongs in
# its own workflow gated on this one, not as another job that a pull request could reach.
on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]
  workflow_dispatch:

# A new push to a pull request makes the run for the previous one worthless. Pushes to main and
# testing are not cancelled, so each merge keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Both dialects, because the repository supports both and nothing else keeps them honest.
  # TestNoDialectSpecificSQL catches a statement written in one dialect's words before it runs;
  # this catches the behaviour that no static check can see — the encodings pgx refuses, the
  # aggregates Postgres asks about, the cursor rules SQLite has and Postgres does not.
  #
  # SQLite runs everything. Postgres runs only internal/app, the one package that reads
  # TEST_DATABASE_URL, split four ways: every test there migrates a fresh schema, which on a
  # hosted runner made the package take ten minutes against SQLite's two.
  test:
    name: go test (${{ matrix.dialect }}${{ matrix.shard && format(' {0}/4', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dialect: sqlite, shard: 0 }
          - { dialect: postgres, shard: 1 }
          - { dialect: postgres, shard: 2 }
          - { dialect: postgres, shard: 3 }
          - { dialect: postgres, shard: 4 }
    services:
      postgres:
        # An empty image skips the service, so the SQLite leg does not wait for a database.
        image: ${{ matrix.dialect == 'postgres' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: attesttag_test
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      TEST_DATABASE_URL: ${{ matrix.dialect == 'postgres' && 'postgres://postgres:test@localhost:5432/attesttag_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # The console is embedded with //go:embed, so it has to exist before anything compiles.
      - run: cd ui && npm ci --no-audit --no-fund && npm run build
      # -skip TestEvals, as `make test` does: it costs money and needs a running bot.
      - name: go vet and go test
        if: matrix.dialect == 'sqlite'
        run: go vet ./... && go test -skip TestEvals -timeout 30m ./...
      # Round-robin over the sorted test names, so each shard is a stable quarter of the list.
      - name: go test internal/app, shard ${{ matrix.shard }} of 4
        if: matrix.dialect == 'postgres'
        run: |
          tests=$(go test -list . ./internal/app | grep -E '^(Test|Fuzz|Example)' \
            | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i - 1' | paste -sd'|' -)
          go test -skip TestEvals -timeout 30m -run "^(${tests})\$" ./internal/app

  console:
    name: console types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cd ui && npm ci --no-audit --no-fund
      - run: cd ui && npx tsc --noEmit
      - run: cd ui && npm run build # the static export the binary embeds

  # The deploy scripts against fake aws/az/gcloud/docker CLIs — `make test-deploy`. No cloud
  # account and no credentials; deploy/test/README.md says what it does and does not prove.
  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: ./deploy/test/run.sh

  # Not a pull-request check: nothing is pushed, so on a pull request it would only be eight
  # minutes of proving the Dockerfile still builds. It runs on a merge into main instead, and by
  # hand, until a deploy workflow builds and pushes the image for real.
  image:
    name: image builds for both architectures
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      # The guard on .dockerignore. Without that file the context is the whole working tree —
      # roughly 4 GB, including a signed-in browser profile under video/.auth, tenants' uploaded
      # documents and the dotenv files. It is an allowlist, so the way it breaks is by silently
      # excluding something the build needs; the build below is what catches that. The way it
      # rots is by someone re-including a directory, which is what this number catches.
      - name: Build context stays small
        run: |
          docker build --no-cache --progress=plain --target build -t ctx-probe . 2>&1 \
            | tee /tmp/build.log || true
          bytes=$(grep -oE 'transferring context: [0-9.]+[kMG]?B' /tmp/build.log \
            | tail -1 | grep -oE '[0-9.]+[kMG]?B' \
            | awk '/GB/{printf "%.0f", $0*1e9} /MB/{printf "%.0f", $0*1e6} /kB/{printf "%.0f", $0*1e3}')
          echo "build context: ${bytes:-unknown} bytes"
          if [ -z "$bytes" ]; then echo "could not read the context size from the build log" >&2; exit 1; fi
          if [ "$bytes" -gt 26214400 ]; then
            echo "::error::the build context is $bytes bytes, over the 25 MB ceiling — check .dockerignore" >&2
            exit 1
          fi

      # Cross-compiled, not emulated: see the comment in release.yml. If this job becomes slow,
      # something has broken the $BUILDPLATFORM pinning in the Dockerfile rather than needing
      # a bigger runner.
      - name: Build amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check the main and testing rulesets require, so adding, renaming or sharding a job
  # above does not mean editing the ruleset. A skipped or cancelled job counts as a failure.
  passed:
    name: ci passed
    if: always()
    needs: [test, console, deploy-scripts]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: echo "::error::a required job did not pass" && exit 1
      - run: echo "all required jobs passed"
