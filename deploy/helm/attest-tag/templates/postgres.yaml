{{- if .Values.postgres.enabled }}
{{- if .Values.database.url }}
{{- fail "postgres.enabled and database.url are both set. One of them is the database this release talks to; pick it. Leave database.url empty to run the Postgres in this chart, or turn postgres.enabled off to use the server you brought." }}
{{- end }}
# The Postgres this release runs, for a cluster with no managed database to point at. One
# replica and one ReadWriteOnce volume, which is what one bot needs and is not high
# availability: losing the node is downtime until this pod is rescheduled onto its volume.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "attest-tag.postgresName" . }}
  labels: {{- include "attest-tag.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "attest-tag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "attest-tag.postgresName" . }}
  labels: {{- include "attest-tag.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "attest-tag.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "attest-tag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "attest-tag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext: {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext: {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: attesttag
            - name: POSTGRES_DB
              value: attesttag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attest-tag.secretName" . }}
                  key: POSTGRES_PASSWORD
            # A subdirectory rather than the volume root: a PVC often arrives with a lost+found
            # in it, and initdb refuses a directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "attesttag", "-d", "attesttag"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "attesttag"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.postgres.persistence.accessMode }}]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
