{{- /* The five the binary refuses to start without. Checked here rather than left to the pod,
       because a release that renders cleanly and then CrashLoopBackOffs on a missing variable
       costs an install, a debug session and a `kubectl logs` to learn what `helm install` could
       have said outright. MASTER_KEY is in the list because the image sets REQUIRE_MASTER_KEY,
       so it refuses to start rather than seal credentials under a key nobody kept. The client
       pair is in it because connecting a workspace is an OAuth install: without it the
       deployment comes up healthy and can never attach a workspace. Only checkable when this
       chart owns the Secret — the contents of an existingSecret are the operator's to get right. */}}
{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.MASTER_KEY }}
{{- fail "secrets.MASTER_KEY is required: the bot exits at startup without it. It seals every stored credential, so generate it once with `openssl rand -base64 32`, back it up somewhere other than this cluster, and never replace it on a deployment that has data. Set --set secrets.MASTER_KEY=... or use existingSecret." }}
{{- end }}
{{- range $k := list "SLACK_SIGNING_SECRET" "SLACK_CLIENT_ID" "SLACK_CLIENT_SECRET" "OPENROUTER_API_KEY" }}
{{- if not (index $.Values.secrets $k) }}
{{- fail (printf "secrets.%s is required: the bot exits at startup without it. SLACK_* come from api.slack.com/apps -> Basic Information -> App Credentials (and register https://<ingress.host>/slack/oauth/callback as a redirect URL on the app); OPENROUTER_API_KEY from openrouter.ai/keys, or point config.LLM_BASE_URL at any OpenAI-compatible endpoint. Set --set secrets.%s=... or use existingSecret." $k $k) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attest-tag.fullname" . }}
  labels: {{- include "attest-tag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- /* Storage you brought. In the Secret rather than the env block because a Postgres URL
         carries a password and an S3 key is a key. */}}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.documents.s3.url }}
  DOCS_S3_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.documents.s3.keyId }}
  DOCS_S3_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.documents.s3.secret }}
  DOCS_S3_SECRET: {{ . | quote }}
  {{- end }}
  {{- /* Storage this release runs itself. The password is generated on install and read back
         out of this Secret on upgrade (attest-tag.bundledPassword), so it survives. */}}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ include "attest-tag.postgresPassword" . | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  MINIO_ROOT_PASSWORD: {{ include "attest-tag.minioPassword" . | quote }}
  {{- end }}
{{- end }}
