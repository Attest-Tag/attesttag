{{- if .Values.serviceAccount.create }}
# The bot's own account. It holds a Kubernetes API token only when it has something to do with
# one: worker.enabled binds it a Role that may create, watch and delete Jobs in this namespace
# (worker-rbac.yaml), and with the worker off it needs the API for nothing at all. A pod that
# parses attacker-supplied PDFs and runs model-authored JavaScript should not be carrying a
# credential it never uses.
#
# Set here *and* on the pod spec, for the reason the worker's own account gives: either one
# alone is one upgrade away from silently flipping back.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attest-tag.serviceAccountName" . }}
  labels: {{- include "attest-tag.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.worker.enabled }}
{{- end }}
